ACCESS_TOKEN_EXPIRE_MINUTES: ${ssm:/turfbook/identity/dev/access_token_expire_minutes}
JWT_PRIVATE_KEY: '{{resolve:secretsmanager:turfbook/identity/dev/jwt-private-key}}'
DATABASE_URL:
  Fn::Sub:
    - 'postgresql+psycopg://${DbUser}:${DbPassword}@${DbHost}:${DbPort}/${DbName}'
    - DbUser: '{{resolve:secretsmanager:turfbook/identity/dev/db:SecretString:username}}'
      DbPassword: '{{resolve:secretsmanager:turfbook/identity/dev/db:SecretString:password}}'
      DbName: '{{resolve:secretsmanager:turfbook/identity/dev/db:SecretString:dbname}}'
      DbHost: ${ssm:/turfbook/dev/db_host}
      DbPort: ${ssm:/turfbook/dev/db_port}
NOTICES_TOPIC_ARN: ${ssm:/turfbook/notifications/dev/topic_arn}
ACCOUNTS_API_KEY: '{{resolve:secretsmanager:turfbook/identity/dev/accounts-api-key}}'
BLOCK_DAYS_BEFORE_CLOSE: ${ssm:/turfbook/identity/dev/block_days_before_close, '7'}
SUPPORT_GRACE_MINUTES: ${ssm:/turfbook/identity/dev/support_grace_minutes, '60'}
USER_WINDOW_MINUTES: ${ssm:/turfbook/identity/dev/user_window_minutes, '60'}
PASSWORD_DEADLINE_MINUTES: ${ssm:/turfbook/identity/dev/password_deadline_minutes, '5'}
PASSWORD_UPDATE_INTERVAL_MINUTES: ${ssm:/turfbook/identity/dev/password_update_interval_minutes, '43200'}
MAX_PASSWORD_ATTEMPTS: ${ssm:/turfbook/identity/dev/max_password_attempts, '5'}
MAX_FAILED_RECOVERIES_PER_WEEK: ${ssm:/turfbook/identity/dev/max_failed_recoveries_per_week, '4'}
PASSWORD_MIN_DIFFERENCE: ${ssm:/turfbook/identity/dev/password_min_difference, '3'}
REQUEST_CODE_MIN_SECONDS: ${ssm:/turfbook/identity/dev/request_code_min_seconds, '1'}
