ACCESS_TOKEN_EXPIRE_MINUTES: ${ssm:/turfbook/identity/dev/access_token_expire_minutes}
JWT_PRIVATE_KEY: '{{resolve:secretsmanager:turfbook/identity/dev/jwt-private-key}}'
DATABASE_URL:
  Fn::Sub:
    - 'postgresql+psycopg://${DbUser}:${DbPassword}@${DbHost}:${DbPort}/${DbName}'
    - DbUser: '{{resolve:secretsmanager:turfbook/identity/dev/db:SecretString:username}}'
      DbPassword: '{{resolve:secretsmanager:turfbook/identity/dev/db:SecretString:password}}'
      DbHost: '{{resolve:secretsmanager:turfbook/identity/dev/db:SecretString:host}}'
      DbPort: '{{resolve:secretsmanager:turfbook/identity/dev/db:SecretString:port}}'
      DbName: '{{resolve:secretsmanager:turfbook/identity/dev/db:SecretString:dbname}}'
