service: turfbook-identity
frameworkVersion: '~4.43.0'

stages:
  default:
    params:
      privateSubnetA: subnet-0163ffcf34770d937
      privateSubnetB: subnet-0f44784a3de31da43
      lambdaDbSecurityGroup: sg-094dae12950b8a2e9
      snsManagedKeyId: 8dfab779-9d69-4efb-b954-bb1970192247

provider:
  name: aws
  runtime: python3.12
  architecture: arm64
  region: us-east-1
  logRetentionInDays: 7
  stackTags:
    project: turfbook
    service: turfbook-identity
    stage: ${sls:stage}
  httpApi:
    payload: '2.0'
  vpc:
    subnetIds:
      - ${param:privateSubnetA}
      - ${param:privateSubnetB}
    securityGroupIds:
      - ${param:lambdaDbSecurityGroup}
  iam:
    role:
      mode: perFunction
      permissionsBoundary: arn:aws:iam::${aws:accountId}:policy/turfbook-lambda-boundary
  environment: ${file(./deploy/env/${sls:stage}.yml)}

custom:
  pythonRequirements:
    fileName: requirements/base.txt
    layer: true
    dockerizePip: true

package:
  patterns:
    - '!./**'
    - 'app/**'
    - 'config/**'
    - 'alembic/**'
    - 'alembic.ini'

functions:
  api:
    handler: app.user_identity.main.handler
    layers:
      - Ref: PythonRequirementsLambdaLayer
    events:
      - httpApi: '*'
    timeout: 15
    iam:
      role:
        statements:
          - Effect: Allow
            Action: sns:Publish
            Resource: ${ssm:/turfbook/notifications/${sls:stage}/topic_arn}
          - Effect: Allow
            Action:
              - kms:GenerateDataKey*
              - kms:Decrypt
            Resource: arn:aws:kms:${aws:region}:${aws:accountId}:key/${param:snsManagedKeyId}

  migrate:
    handler: app.migrations.handler.handler
    layers:
      - Ref: PythonRequirementsLambdaLayer
    timeout: 30
    maximumRetryAttempts: 0

  accounts:
    handler: app.user_identity.accounts_main.handler
    layers:
      - Ref: PythonRequirementsLambdaLayer
    timeout: 15
    iam:
      role:
        statements:
          - Effect: Allow
            Action: sns:Publish
            Resource: ${ssm:/turfbook/notifications/${sls:stage}/topic_arn}
          - Effect: Allow
            Action:
              - kms:GenerateDataKey*
              - kms:Decrypt
            Resource: arn:aws:kms:${aws:region}:${aws:accountId}:key/${param:snsManagedKeyId}

  dailyReview:
    name: ${self:service}-${sls:stage}-daily-review
    handler: app.user_identity.infrastructure.jobs.daily_review.handler
    layers:
      - Ref: PythonRequirementsLambdaLayer
    timeout: 60
    maximumRetryAttempts: 2
    iam:
      role:
        statements:
          - Effect: Allow
            Action: sns:Publish
            Resource: ${ssm:/turfbook/notifications/${sls:stage}/topic_arn}
          - Effect: Allow
            Action:
              - kms:GenerateDataKey*
              - kms:Decrypt
            Resource: arn:aws:kms:${aws:region}:${aws:accountId}:key/${param:snsManagedKeyId}

  yearlyPurge:
    name: ${self:service}-${sls:stage}-yearly-purge
    handler: app.user_identity.infrastructure.jobs.yearly_purge.handler
    layers:
      - Ref: PythonRequirementsLambdaLayer
    timeout: 60
    maximumRetryAttempts: 2

resources:
  - ${file(./deploy/resources/http-api.yml)}
  - ${file(./deploy/resources/migrations.yml)}
  - ${file(./deploy/resources/keep-warm.yml)}
  - ${file(./deploy/resources/accounts-api.yml)}
  - ${file(./deploy/resources/schedules.yml)}
