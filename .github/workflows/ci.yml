name: CI

# Only on pull requests and inside deploy.yml: a push to a branch with an open pull
# request would otherwise run it twice.
on:
  pull_request:
    branches: [develop, main]
  workflow_call:
    inputs:
      ref:
        description: Commit to test; empty for the commit of the event (a redeploy passes an earlier one).
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The jobs are shared; the service passes only its data: postgres-db, ci-env,
  # setup-script.
  ci:
    uses: Fabio244000/turfbook-workflows/.github/workflows/python-ci.yml@b9077a3bb031a2fb2ca997e71c36669567e5a71b # main
    with:
      ref: ${{ inputs.ref }}
      postgres-db: identity
      # Settings requires them; test-only values: tests never publish (fakes and a
      # botocore Stubber) and the key is never a real one.
      ci-env: |
        NOTICES_TOPIC_ARN=arn:aws:sns:us-east-1:000000000000:turfbook-notifications-ci-notices
        ACCOUNTS_API_KEY=ci-accounts-api-key
      setup-script: scripts/ci/session_token_key.sh
